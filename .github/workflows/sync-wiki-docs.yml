# AI Generated file! TODO: Replace with human code
# NOTE: This workflow requires a WIKI_PAT secret to be set up in repository settings
# The secret should be a Personal Access Token with 'public_repo' scope
# If WIKI_PAT is not set, the workflow will be skipped
name: Sync Wiki Documentation

on:
  push:
    branches: [ main ]  # Only sync when merged to main
    paths:
      - 'include/**'
      - 'tools/wiki_gen.py'
      - '.github/workflows/sync-wiki-docs.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    name: Update Wiki from Source Documentation
    # Skip if WIKI_PAT is not configured
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit != null

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.WIKI_PAT }}
        continue-on-error: true

      - name: Check if wiki checkout succeeded
        id: wiki-check
        run: |
          if [ -d "wiki-repo" ] && [ -n "$(ls -A wiki-repo)" ]; then
            echo "wiki_available=true" >> $GITHUB_OUTPUT
          else
            echo "wiki_available=false" >> $GITHUB_OUTPUT
            echo "⚠ Wiki checkout failed - WIKI_PAT may not be configured"
            echo "To enable wiki syncing, create a Personal Access Token and add it as WIKI_PAT secret"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
        if: steps.wiki-check.outputs.wiki_available == 'true'

      - name: Configure Git for Wiki
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        if: steps.wiki-check.outputs.wiki_available == 'true'

      - name: Generate and sync documentation
        run: |
          # Generate wiki pages from headers
          python tools/wiki_gen.py --output wiki-repo
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        if: steps.wiki-check.outputs.wiki_available == 'true'

      - name: Commit and push to Wiki
        id: push-wiki
        run: |
          cd wiki-repo
          
          # Check if there are changes
          if git status --porcelain | grep -q .; then
            git add .
            git commit -m "Auto-sync documentation from main branch
            
            Source commit: ${{ github.sha }}
            Triggered by: ${{ github.event_name }}"
            
            # Push directly to master (wikis don't support PRs)
            git push origin master
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
        if: steps.wiki-check.outputs.wiki_available == 'true'


      - name: Report results
        if: always()
        run: |
          echo "✓ Wiki documentation sync workflow completed"
          if [ "${{ steps.push-wiki.outputs.has_changes }}" = "true" ]; then
            echo "✓ Wiki updated with latest documentation"
          else
            echo "ℹ No documentation changes detected"
          fi
